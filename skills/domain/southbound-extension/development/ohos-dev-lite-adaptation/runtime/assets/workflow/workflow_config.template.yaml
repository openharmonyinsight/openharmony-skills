# workflow_config.yaml
# ───────────────────────────────────────────────────────
# 通用 Workflow 配置模板
# ───────────────────────────────────────────────────────
# 
# 用法:
#   1. 复制本文件到你的项目根目录: cp {{ASSET_ROOT}}/workflow/workflow_config.template.yaml <your-project>/workflow_config.yaml
#   2. 填写以下所有 [用户输入] 字段
#   3. 运行 skills/ohos-dev-workflow-router/SKILL.md（工作流编排器）开始工作流开发，各 step 按需读本文件
#
# 原则:
#   - 本文件是工作流 SKILL 的**唯一领域依赖入口**
#   - SKILL 正文中不应硬编码任何芯片名、路径、工具链版本
#   - 所有领域特定信息要么来自本文件，要么在 SKILL 执行时询问用户
#   - [用户输入] = 必填; (可选) = 有默认值可不填
# ───────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════
# §1  目标系统 (Target System) — [用户输入]
# ═══════════════════════════════════════════════════════════

target:
  name: ""              # [必填] 芯片型号, e.g. "Hi3861V100", "STM32F407", "ESP32-S3"
  vendor: ""            # [必填] 芯片厂商, e.g. "hisilicon", "st", "espressif"
  board: ""             # [必填] 开发板名称, e.g. "hispark_pegasus", "nucleo-f407"
  product_type: ""       # [必填] 产品类型, e.g. "wifiiot", "mini_system"
  system_type: ""        # [必填] 当前流程仅支持 mini/small:
                          #   "mini"     → L0 资源等级；内核/驱动模型由 target profile 选择
                          #   "small"    → L1 资源等级；可选择 Linux、LiteOS-A 或其他 profile 支持的组合
                          #   "standard" → L2/Linux（当前流程拒绝，需独立流程）
  arch: ""               # [必填] CPU 架构, e.g. "riscv32", "arm-cortex-m4", "xtensa"
  abi: ""                # [必填] ABI, e.g. "ilp32", "eabi", "hard"
  flash_size: 0          # [可选] Flash 大小 (bytes), 用于 L5 固件大小验证
  ram_size: 0            # [可选] RAM 大小 (bytes)
  profile: ""            # [P1 Step 5 写入] 选定 target profile 的路径（内置在
                          #   {{ASSET_ROOT}}/workflow/target-profiles/，或用户项目内自定义）。
                          #   P1 加载后写入本字段 + session manifest；P2/P3/P4 消费前校验
                          #   两者一致（不一致停下问）。加载规则见编排器 §target profile 加载规则

  # ── 工具链配置 (Toolchain) — [可选，不填则 auto-detect] ──
  # 用户想用自己的工具链（不用环境里的）时填这里。mode=user 时工作流优先用此配置、不 auto-detect。
  # 不确定可留 mode=auto，工作流 auto-detect PATH，缺失时交互问用户。详见 README「工具链配置」。
  # 工具链统一配置在 §4 顶层 toolchain，避免出现两个事实源。

# ═══════════════════════════════════════════════════════════
# §1.0 工作流编排 (Workflow Control) — [可选，有默认值]
# ═══════════════════════════════════════════════════════════
# 宿主适配器从本段读取跨阶段路由/调度策略，并与 DECISIONS.md 对账；
# 不解析 DECISIONS.md 的 Markdown。
workflow:
  mode: full                # full | verify-only | quick-prototype
  dispatch_mode: single     # single | enabled | required
  p7_escalation: auto       # auto: HardFault/启动挂起/间歇失败 -> ultrabrain；其余 -> unspecified-high

# ═══════════════════════════════════════════════════════════
# §1.1 三层仓库模型 (Three-Layer Repo Model)
# ═══════════════════════════════════════════════════════════
#
# OpenHarmony 每个芯片适配由三个独立仓库组成:
#   SoC 层 (device_soc_*)  → 芯片 SDK、HAL 驱动、寄存器操作
#   Board 层 (device_board_*) → 开发板外设、启动配置、defconfig
#   Vendor 层 (vendor_*)    → 产品定义(config.json)、子系统列表、打包
#
# ⚠️ 关键: Board/Vendor 仓库名**不一定**与 SoC 厂商名一致!
#   例: Rockchip SoC → Board仓是 device_board_hihope (润和软件)
#       NXP SoC → Board仓是 device_board_osware (OSware)
#       Gigadevice SoC → Board仓是 device_board_talkweb (拓维信息)
#
# 仓库地址格式: Gitee https://gitee.com/openharmony/<repo>
#                GitHub https://github.com/openharmony/<repo>

repos:
  soc:                   # [必填] SoC 适配仓库
    name: ""             #   仓库名, e.g. "device_soc_hisilicon"
    url_gitee: ""         #   Gitee 地址 (可选, 用于参考)
    url_github: ""        #   GitHub 地址 (可选, 用于参考)
    adapter_path: ""      #   [必填] 适配层代码在仓库中的路径
                          #   e.g. "device/soc/hisilicon/hi3861v100/hi3861_adapter/"
  board:                 # [必填] Board 适配仓库
    name: ""             #   仓库名, e.g. "device_board_hisilicon"
    url_gitee: ""
    url_github: ""
    config_path: ""      #   板级配置路径, e.g. "device/board/hisilicon/pegasus/"
  vendor:                # [必填] Vendor 产品仓库
    name: ""             #   仓库名, e.g. "vendor_hisilicon"
    url_gitee: ""
    url_github: ""
    product_path: ""     #   产品定义路径, e.g. "vendor/hisilicon/hispark_pegasus/"

# ═══════════════════════════════════════════════════════════
