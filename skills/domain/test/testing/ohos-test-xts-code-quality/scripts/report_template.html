<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XTS代码质量检查报告</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #faf9f5;
      --surface: #ffffff;
      --border: #e8e6dc;
      --text: #141413;
      --text-muted: #b0aea5;
      --accent: #d97757;
      --accent-hover: #c4613f;
      --green: #788c5d;
      --green-bg: #eef2e8;
      --red: #c44;
      --red-bg: #fceaea;
      --yellow: #ffb400;
      --yellow-bg: #fff8e6;
      --header-bg: #141413;
      --header-text: #faf9f5;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .header-meta {
      font-size: 0.85rem;
      opacity: 0.8;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .main {
      padding: 1.5rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
    }
    .section-header {
      font-family: 'Poppins', sans-serif;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-body {
      padding: 1rem;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
    }
    .stat-card-value {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--text);
    }
    .stat-card-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .stat-card.critical { border-color: var(--red); }
    .stat-card.critical .stat-card-value { color: var(--red); }
    .stat-card.warning { border-color: var(--yellow); }
    .stat-card.warning .stat-card-value { color: var(--yellow); }
    .stat-card.success { border-color: var(--green); }
    .stat-card.success .stat-card-value { color: var(--green); }

    .progress-bar {
      height: 24px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      margin-bottom: 0.5rem;
    }
    .progress-segment {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: white;
      transition: width 0.3s;
    }
    .progress-segment.critical { background: var(--red); }
    .progress-segment.warning { background: var(--yellow); }
    .progress-segment.none { background: var(--green); }

    .filter-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      font-family: 'Poppins', sans-serif;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { background: var(--bg); }
    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }
    .data-table th, .data-table td {
      padding: 0.625rem 0.75rem;
      text-align: left;
      border: 1px solid var(--border);
    }
    .data-table th {
      font-family: 'Poppins', sans-serif;
      background: var(--header-bg);
      color: var(--header-text);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      user-select: none;
    }
    .data-table th:hover { opacity: 0.9; }
    .data-table tr:hover { background: var(--bg); }
    .data-table td.critical { color: var(--red); font-weight: 600; }
    .data-table td.warning { color: var(--yellow); font-weight: 600; }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .pagination-btn {
      font-family: 'Poppins', sans-serif;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
    }
    .pagination-btn:hover { background: var(--bg); }
    .pagination-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .pagination-info {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .badge {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.critical { background: var(--red-bg); color: var(--red); }
    .badge.warning { background: var(--yellow-bg); color: var(--yellow); }
    .badge.category { background: rgba(33, 150, 243, 0.12); color: #1976d2; }

    .code-snippet {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5rem;
      font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 150px;
      overflow-y: auto;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .modal-overlay.visible { display: flex; }
    .modal-content {
      background: var(--surface);
      border-radius: 8px;
      max-width: 800px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .modal-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }
    .modal-body {
      padding: 1rem;
    }

    .download-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: white;
      border-radius: var(--radius);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.15s;
    }
    .download-link:hover { background: var(--accent-hover); }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .tab {
      font-family: 'Poppins', sans-serif;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .empty-state {
      color: var(--text-muted);
      font-style: italic;
      padding: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div>
        <h1>XTS代码质量检查报告</h1>
        <div class="header-meta">
          <span>版本: <strong id="version">-</strong></span>
          <span>扫描路径: <strong id="scan-root">-</strong></span>
          <span>扫描时间: <strong id="scan-time">-</strong></span>
        </div>
      </div>
      <a class="download-link" id="download-xlsx" download="XTS_代码质量检查报告.xlsx">
        ↓ 下载Excel报告
      </a>
    </div>

    <div class="main">
      <!-- 统计卡片 -->
      <div class="section">
        <div class="section-header">扫描统计</div>
        <div class="section-body">
          <div class="stat-cards">
            <div class="stat-card">
              <div class="stat-card-value" id="stat-files">0</div>
              <div class="stat-card-label">扫描文件数</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-value" id="stat-rules">0</div>
              <div class="stat-card-label">活动规则数</div>
            </div>
            <div class="stat-card critical">
              <div class="stat-card-value" id="stat-critical">0</div>
              <div class="stat-card-label">Critical问题</div>
            </div>
            <div class="stat-card warning">
              <div class="stat-card-value" id="stat-warning">0</div>
              <div class="stat-card-label">Warning问题</div>
            </div>
            <div class="stat-card success">
              <div class="stat-card-value" id="stat-clean">0</div>
              <div class="stat-card-label">Clean规则数</div>
            </div>
          </div>
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <!-- 规则统计表 -->
      <div class="section">
        <div class="section-header">
          规则统计
          <span id="rule-count-info"></span>
        </div>
        <div class="section-body">
          <div class="filter-bar" id="rule-filter-bar">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="critical">Critical</button>
            <button class="filter-btn" data-filter="warning">Warning</button>
            <button class="filter-btn" data-filter="has-issues">有问题</button>
            <button class="filter-btn" data-filter="clean">无问题</button>
          </div>
          <div class="tabs">
            <button class="tab active" data-tab="table">表格视图</button>
            <button class="tab" data-tab="chart">图表视图</button>
          </div>
          <div class="tab-panel active" id="panel-table">
            <table class="data-table" id="rule-table">
              <thead>
                <tr>
                  <th data-sort="rule">规则编号</th>
                  <th data-sort="category">问题类别</th>
                  <th data-sort="name">问题类型</th>
                  <th data-sort="severity">严重级别</th>
                  <th data-sort="fixable">可自动修复</th>
                  <th data-sort="count">问题数量</th>
                </tr>
              </thead>
              <tbody id="rule-table-body"></tbody>
            </table>
          </div>
          <div class="tab-panel" id="panel-chart">
            <div id="chart-container" style="height: 300px;"></div>
          </div>
        </div>
      </div>

      <!-- 问题明细表 -->
      <div class="section">
        <div class="section-header">
          问题明细
          <span id="issue-count-info"></span>
        </div>
        <div class="section-body">
          <div class="filter-bar" id="issue-filter-bar">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="critical">Critical</button>
            <button class="filter-btn" data-filter="warning">Warning</button>
          </div>
          <table class="data-table" id="issue-table">
            <thead>
              <tr>
                <th data-sort="rule">规则</th>
                <th data-sort="severity">级别</th>
                <th data-sort="fixable">可自动修复</th>
                <th data-sort="file">文件</th>
                <th data-sort="line">行号</th>
                <th data-sort="testcase">用例</th>
                <th>代码片段</th>
                <th>修复建议</th>
              </tr>
            </thead>
            <tbody id="issue-table-body"></tbody>
          </table>
          <div class="pagination" id="issue-pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 详情模态框 -->
  <div class="modal-overlay" id="modal-detail">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">问题详情</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    const EMBEDDED_DATA = __DATA_PLACEHOLDER__;

    let currentRuleFilter = 'all';
    let currentIssueFilter = 'all';
    let currentIssueSort = { col: 'rule', dir: 'asc' };
    let currentIssuePage = 1;
    const ISSUE_PAGE_SIZE = 50;

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function init() {
      renderHeader();
      renderStats();
      renderRuleTable();
      renderIssueTable();
      setupXlsxDownload();
      setupFilters();
      setupTabs();
      setupSort();
    }

    function renderHeader() {
      const meta = EMBEDDED_DATA.meta || {};
      document.getElementById('version').textContent = meta.version || '-';
      document.getElementById('scan-root').textContent = meta.scan_root || '-';
      document.getElementById('scan-time').textContent = meta.scan_time || '-';
    }

    function renderStats() {
      const meta = EMBEDDED_DATA.meta || {};
      const stats = EMBEDDED_DATA.stats || {};
      const issues = EMBEDDED_DATA.issues || [];

      document.getElementById('stat-files').textContent = meta.total_files || 0;
      document.getElementById('stat-rules').textContent = Object.keys(stats).length;
      
      const criticalCount = issues.filter(i => i.severity === 'Critical').length;
      const warningCount = issues.filter(i => i.severity === 'Warning').length;
      const cleanRules = Object.keys(stats).filter(r => stats[r] === 0).length;
      
      document.getElementById('stat-critical').textContent = criticalCount;
      document.getElementById('stat-warning').textContent = warningCount;
      document.getElementById('stat-clean').textContent = cleanRules;

      const total = criticalCount + warningCount;
      const progressBar = document.getElementById('progress-bar');
      if (total > 0) {
        const criticalPct = (criticalCount / total * 100).toFixed(1);
        const warningPct = (warningCount / total * 100).toFixed(1);
        progressBar.innerHTML = `
          <div class="progress-segment critical" style="width: ${criticalPct}%">${criticalPct}% Critical</div>
          <div class="progress-segment warning" style="width: ${warningPct}%">${warningPct}% Warning</div>
        `;
      } else {
        progressBar.innerHTML = '<div class="progress-segment none" style="width: 100%">100% Clean</div>';
      }
    }

    function renderRuleTable() {
      const rules = EMBEDDED_DATA.rules || [];
      const stats = EMBEDDED_DATA.stats || {};
      const fixableRules = EMBEDDED_DATA.fixable_rules || [];
      const fixGuidePaths = EMBEDDED_DATA.fix_guide_paths || {};
      const tbody = document.getElementById('rule-table-body');
      
      let filteredRules = rules;
      if (currentRuleFilter === 'critical') {
        filteredRules = rules.filter(r => r.severity === 'Critical');
      } else if (currentRuleFilter === 'warning') {
        filteredRules = rules.filter(r => r.severity === 'Warning');
      } else if (currentRuleFilter === 'has-issues') {
        filteredRules = rules.filter(r => stats[r.rule] > 0);
      } else if (currentRuleFilter === 'clean') {
        filteredRules = rules.filter(r => stats[r.rule] === 0);
      }

      tbody.innerHTML = '';
      filteredRules.forEach(r => {
        const count = stats[r.rule] || 0;
        const isFixable = fixableRules.includes(r.rule);
        const fixGuide = isFixable ? (fixGuidePaths[r.rule] || '-') : '-';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${r.rule}</strong></td>
          <td><span class="badge category">${r.category}</span></td>
          <td>${r.name}</td>
          <td><span class="badge ${r.severity.toLowerCase()}">${r.severity}</span></td>
          <td>${isFixable ? '<span class="badge" style="background: #e8f5e9; color: #2e7d32;">Yes</span>' : 'No'}</td>
          <td class="${count > 0 ? r.severity.toLowerCase() : ''}">${count}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('rule-count-info').textContent = `共 ${filteredRules.length} 条规则`;
    }

    function renderIssueTable() {
      const issues = EMBEDDED_DATA.issues || [];
      const fixableRules = EMBEDDED_DATA.fixable_rules || [];
      const tbody = document.getElementById('issue-table-body');
      
      let filteredIssues = issues;
      if (currentIssueFilter === 'critical') {
        filteredIssues = filteredIssues.filter(i => i.severity === 'Critical');
      } else if (currentIssueFilter === 'warning') {
        filteredIssues = filteredIssues.filter(i => i.severity === 'Warning');
      }

      filteredIssues.sort((a, b) => {
        const va = a[currentIssueSort.col];
        const vb = b[currentIssueSort.col];
        if (currentIssueSort.dir === 'asc') return va > vb ? 1 : -1;
        return va < vb ? 1 : -1;
      });

      const totalPages = Math.ceil(filteredIssues.length / ISSUE_PAGE_SIZE);
      currentIssuePage = Math.min(currentIssuePage, totalPages || 1);
      const startIdx = (currentIssuePage - 1) * ISSUE_PAGE_SIZE;
      const pageIssues = filteredIssues.slice(startIdx, startIdx + ISSUE_PAGE_SIZE);

      tbody.innerHTML = '';
      pageIssues.forEach((i, idx) => {
        const isFixable = fixableRules.includes(i.rule);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${escapeHtml(i.rule)}</strong></td>
          <td><span class="badge ${escapeHtml(i.severity.toLowerCase())}">${escapeHtml(i.severity)}</span></td>
          <td>${isFixable ? '<span class="badge" style="background: #e8f5e9; color: #2e7d32;">Yes</span>' : 'No'}</td>
          <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(i.file)}</td>
          <td>${escapeHtml(i.line)}</td>
          <td style="max-width: 150px; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(i.testcase) || '-'}</td>
          <td><button class="filter-btn" onclick="showDetail(${startIdx + idx})">查看</button></td>
          <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(i.suggestion) || '-'}</td>
        `;
        tbody.appendChild(tr);
      });

      renderPagination(totalPages);
      document.getElementById('issue-count-info').textContent = 
        `显示 ${startIdx + 1}-${startIdx + pageIssues.length} / ${filteredIssues.length} 个问题`;
    }

    function renderPagination(totalPages) {
      const pagination = document.getElementById('issue-pagination');
      pagination.innerHTML = '';
      
      const prevBtn = document.createElement('button');
      prevBtn.className = 'pagination-btn';
      prevBtn.textContent = '←';
      prevBtn.disabled = currentIssuePage === 1;
      prevBtn.onclick = () => { currentIssuePage--; renderIssueTable(); };
      pagination.appendChild(prevBtn);

      const info = document.createElement('span');
      info.className = 'pagination-info';
      info.textContent = `${currentIssuePage} / ${totalPages}`;
      pagination.appendChild(info);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'pagination-btn';
      nextBtn.textContent = '→';
      nextBtn.disabled = currentIssuePage === totalPages;
      nextBtn.onclick = () => { currentIssuePage++; renderIssueTable(); };
      pagination.appendChild(nextBtn);
    }

    function showDetail(idx) {
      const issue = EMBEDDED_DATA.issues[idx];
      const modal = document.getElementById('modal-detail');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');

      title.textContent = `${issue.rule} - ${issue.file}:${issue.line}`;
      body.innerHTML = `
        <div style="margin-bottom: 1rem;">
          <strong>所属用例:</strong> ${escapeHtml(issue.testcase) || '-'}
        </div>
        <div style="margin-bottom: 1rem;">
          <strong>所属子系统:</strong> ${escapeHtml(issue.subsystem) || '-'}
        </div>
        <div style="margin-bottom: 1rem;">
          <strong>修复建议:</strong><br>
          <div style="margin-top: 0.5rem; padding: 0.5rem; background: var(--bg); border-radius: 4px;">
            ${escapeHtml(issue.suggestion) || '-'}
          </div>
        </div>
        <div>
          <strong>代码片段:</strong>
          <div class="code-snippet" style="margin-top: 0.5rem;">${escapeHtml(issue.snippet) || '-'}</div>
        </div>
      `;
      modal.classList.add('visible');
    }

    function closeModal() {
      document.getElementById('modal-detail').classList.remove('visible');
    }

    function setupFilters() {
      document.getElementById('rule-filter-bar').addEventListener('click', (e) => {
        if (e.target.classList.contains('filter-btn')) {
          document.querySelectorAll('#rule-filter-bar .filter-btn').forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          currentRuleFilter = e.target.dataset.filter;
          renderRuleTable();
        }
      });

      document.getElementById('issue-filter-bar').addEventListener('click', (e) => {
        if (e.target.classList.contains('filter-btn')) {
          document.querySelectorAll('#issue-filter-bar .filter-btn').forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          currentIssueFilter = e.target.dataset.filter;
          currentIssuePage = 1;
          renderIssueTable();
        }
      });
    }

    function setupTabs() {
      document.querySelectorAll('.tabs').forEach(tabs => {
        tabs.addEventListener('click', (e) => {
          if (e.target.classList.contains('tab')) {
            const tabPanel = tabs.parentElement;
            tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tabPanel.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            e.target.classList.add('active');
            tabPanel.querySelector(`#panel-${e.target.dataset.tab}`).classList.add('active');
          }
        });
      });
    }

    function setupSort() {
      document.getElementById('issue-table').addEventListener('click', (e) => {
        if (e.target.dataset.sort) {
          const col = e.target.dataset.sort;
          if (currentIssueSort.col === col) {
            currentIssueSort.dir = currentIssueSort.dir === 'asc' ? 'desc' : 'asc';
          } else {
            currentIssueSort.col = col;
            currentIssueSort.dir = 'asc';
          }
          currentIssuePage = 1;
          renderIssueTable();
        }
      });
    }

    function setupXlsxDownload() {
      const excelData = EMBEDDED_DATA.excel_base64;
      if (excelData) {
        const downloadLink = document.getElementById('download-xlsx');
        downloadLink.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + excelData;
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft' && currentIssuePage > 1) {
        currentIssuePage--;
        renderIssueTable();
      }
      if (e.key === 'ArrowRight') {
        const issues = EMBEDDED_DATA.issues || [];
        const filteredIssues = currentIssueFilter === 'all' ? issues :
          issues.filter(i => currentIssueFilter === 'critical' ? i.severity === 'Critical' : i.severity === 'Warning');
        const totalPages = Math.ceil(filteredIssues.length / ISSUE_PAGE_SIZE);
        if (currentIssuePage < totalPages) {
          currentIssuePage++;
          renderIssueTable();
        }
      }
    });

    document.getElementById('modal-detail').addEventListener('click', (e) => {
      if (e.target.id === 'modal-detail') closeModal();
    });

    init();
  </script>
</body>
</html>
