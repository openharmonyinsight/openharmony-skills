# OpenHarmony SDD artifact contract.
#
# Purpose:
# - Describe the current OpenHarmony delivery artifacts in a machine-readable way.
# - Provide one input for later template drift checks and packaging validation.
# - Record the current OpenHarmony delivery contract and accepted alignment targets.

schema: ohos-sdd-artifacts/v1
source_root: .

identifier_grammars:
  acceptance_criterion: AC-<number>(.<number>)*

truth_sources:
  templates: templates
  workflow: workflow
  profiles: profiles

archive:
  target_root: .codespec/changes
  id_patterns:
    - issue-<number>-<slug>
    - draft-<yyyymmdd>-<slug>
  registry: .codespec/registry.md
  release_version_in_directory_name: false
  readiness:
    manifest_statuses:
      - done
      - archived
    require_levels:
      - A
      - B
      - C
      - D
    require_placeholder_free_artifacts: true
    # on_implementation: 状态触发——execution-plan 代码范围映射记录了实际实现时,
    # 归档必须三份 Approved Review Evidence;纯规格/文档变更可选(存在即严校验)。
    # 归档门禁与 manifest.complexity 无关(complexity 仅指导工作流深度)。
    require_approved_review_evidence: on_implementation
    registry_write_after_validation: true

traceability:
  required_chain:
    - proposal
    - spec.ac
    - execution_plan.task
    - code
  completion_constraints:
    - every_ac_maps_to_at_least_one_task
    - every_task_declares_produces_and_consumes
    - changed_state_declares_owner_and_full_lifecycle
    - every_verification_has_expected_and_actual_result
    - anti_fake_completion_has_concrete_evidence
    - planned_scope_maps_to_actual_code_scope
    - every_task_references_spec_and_design_by_stable_id_or_anchor

evidence_policy:
  minimum_archive_required: false
  recommended_root: .codespec/changes/<id>/evidence
  review_evidence:
    - id: spec_compliance
      template: templates/review/spec-compliance.md
      output: .codespec/changes/<id>/evidence/reviews/spec-compliance.md
    - id: code_quality
      template: templates/review/code-quality.md
      output: .codespec/changes/<id>/evidence/reviews/code-quality.md
    - id: verification
      template: templates/review/verification.md
      output: .codespec/changes/<id>/evidence/reviews/verification.md

phase_order:
  - id: define
    name: Define
    zh_name: 定义
  - id: specify
    name: Specify
    zh_name: 规格说明
  - id: design
    name: Design
    zh_name: 设计
  - id: plan
    name: Plan
    zh_name: 计划

artifacts:
  - id: manifest
    layer: core
    file: manifest.md
    template: templates/manifest.md
    phase: all
    status: recommended
    role: work item metadata and cross-artifact index
    default_location: .codespec/changes/<id>/manifest.md
    status_values:
      - draft
      - approved
      - implementing
      - verifying
      - done
      - archived

  - id: proposal
    layer: core
    file: proposal.md
    template: templates/proposal.md
    phase: define
    status: required
    role: concise requirement input and confirmed baseline, with conditional clarification and decision appendix
    default_location: .codespec/changes/<id>/proposal.md
    owns:
      - agent_repository_and_module_exploration_scope
      - prohibited_access_and_modification_boundaries
      - out_of_scope_rebaseline_rule
    required_sections:
      - 需求输入
      - 需求基线
      - Agent Scope Guard
    conditional_sections:
      - section: 附录：澄清与决策记录（条件启用）
        required_when: complex_critical_or_clarification_blocked_or_contested
    status_values:
      - Clarifying
      - AwaitingApproval
      - Approved
      - ChangesRequested
      - Blocked
    legacy_status_values:
      - Draft
      - Baselined
      - Deferred
      - Rejected
    phase_approval:
      phase_status_field: phase_status
      allowed_statuses:
        - clarifying
        - awaiting_approval
        - approved
        - changes_requested
        - blocked
      approval_field: approval
      approved_requires:
        - status
        - approver
        - evidence
        - approved_at
        - baseline_digest
      downstream_requires_approved: true

  - id: design
    layer: core
    file: design.md
    template: templates/design.md
    phase: design
    depends_on:
      - proposal
      - spec
    status: required
    role: verified code-fact baseline, architecture constraints, reusable patterns, structural design, state invariants, and implementation direction
    default_location: .codespec/changes/<id>/design.md
    owns:
      - code_fact_baseline
      - architecture_rule_application
      - existing_pattern_reuse
      - class_and_interface_structure
      - architecture_decisions
      - resource_and_state_ownership
      - state_lifecycle_and_invariants
      - concurrency_model
      - invariant_ac_task_verification_traceability
    required_sections:
      - 需求基线
      - 上下文和现状
      - 适用架构规则
      - 关键设计决策
      - 后续 Task 拆分
      - 风险和开放问题
      - 设计审批
    conditional_sections:
      - section: 代码事实基线
        required_when: change_touches_existing_modules_interfaces_data_state_call_chain_or_runtime_behavior
      - section: 既有模式复用
        required_when: adjacent_capability_or_repository_convention_exists_or_must_be_searched
      - section: 类图
        required_when: inheritance_interface_implementation_or_cross_module_composition_changes
      - section: 状态归属与不变量
        required_when: runtime_state_resource_lifecycle_state_machine_concurrency_hot_path_compatibility_or_migration_changes
    invariant_traceability:
      required_links:
        - spec.ac
        - execution_plan.task
        - verification_method_and_pass_criteria
      identifier: INV-<number>
    status_values:
      - Draft
      - Reviewing
      - Approved
      - Superseded

  - id: spec
    layer: core
    file: spec.md
    template: templates/spec.md
    phase: specify
    depends_on:
      - proposal
    status: required
    role: externally observable behavior, three-tier API acceptance criteria, API and error-code facts, openness and compatibility, and test Red-to-Green traceability
    default_location: .codespec/changes/<id>/spec.md
    owns:
      - externally_observable_acceptance_criteria
      - three_tier_interface_observability
      - then_implementation_boundary
      - api_openness_for_added_changed_and_deprecated_interfaces
      - exact_api_and_error_code_fact_contract
      - ac_verification_and_red_conditions
    required_sections:
      - 用户故事
      - 验收追溯
      - 规则定义
      - 验证映射
      - API 变更分析
      - API 与错误码事实
      - 兼容性声明
    spec_quality:
      acceptance_traceability:
        current_columns:
          - AC
          - 关联规则
          - 可观察表面
        legacy_six_column_shape_supported: true
        task_mapping_source: execution-plan.md
        verification_source: 验证映射
        evidence_source: evidence/reviews
      acceptance_criteria:
        format: WHEN_THEN
        observable_surfaces:
          - end_user
          - public_api
          - system_api
          - inner_api
        then_forbids:
          - internal_data_structure
          - internal_state_machine
          - internal_call_chain
          - implementation_class_or_method
          - internal_cache_queue_or_lock
          - implementation_algorithm
        then_boundary_detection:
          severity: warn
          exemption_marker: ext-ok
          broad_patterns_require_action_verb: true
          gate_disposition_required: true
      api_openness:
        values:
          - Public
          - System
          - InnerAPI
        changed_or_deprecated_requires_current_and_target: true
      api_error_facts:
        existing_requires_source_file_line_or_symbol: true
        exact_signature_or_numeric_value_required: true
        error_code_requires_trigger_external_behavior_ac_and_verification: true
        new_fact_requires_proposal_design_task_or_ac_basis: true
      verification:
        requires_test_entry: true
        requires_red_condition: true
        red_condition_must_explain_pre_implementation_failure: true
    status_values:
      - Draft
      - Review
      - Approved
      - Baselined

  - id: execution_plan
    layer: core
    file: execution-plan.md
    template: templates/execution-plan.md
    phase: plan
    depends_on:
      - proposal
      - spec
      - design
    status: required
    role: implementation plan, task contracts, state lifecycle, expected/actual verification, code/commit/review traceability, and handoff information
    default_location: .codespec/changes/<id>/execution-plan.md
    owns:
      - ac_task_code_commit_review_traceability
      - planned_and_actual_code_scope
      - task_dependencies
      - task_produces_consumes
      - state_ownership_and_lifecycle
      - expected_and_actual_results
      - anti_fake_completion
      - stable_spec_and_design_references
    required_sections:
      - 执行原则
      - 受影响文件全量清单
      - AC 到 Task 追溯
      - Task 依赖
      - Task 列表
      - Task 详情
      - 代码范围映射
      - 实现偏差和开放问题
    required_task_fields:
      - AC 映射
      - 前置依赖
      - 状态所有权和生命周期
      - Design STATE/INV 映射
      - Produces
      - Consumes
      - Files
      - Spec References
      - Design References
      - Anti-Fake Completion
      - Expected Result
      - Actual Result
      - Review Handoff
    status_values:
      - Draft
      - ReadyForReview
      - Approved
      - Superseded

  - id: task
    layer: core
    file: task.md
    template: templates/task.md
    phase: plan
    status: conditional
    required_when:
      - simple_complexity
      - implementation_needs_task_level_handoff
      - multiple_independent_tasks
      - agent_delegation
    role: minimum executable implementation unit
    default_location: .codespec/changes/<id>/tasks/<task-id>.md

  - id: bugfix
    layer: oh-extension
    file: bugfix.md
    template: templates/bugfix.md
    phase: plan
    spans:
      - define
      - plan
    status: conditional
    required_when:
      - bugfix_flow
    role: defect reproduction, root cause, fix plan, and regression scope
    default_location: .codespec/changes/<id>/bugfix.md

  - id: regression_test
    layer: oh-extension
    file: regression-test.md
    template: templates/regression-test.md
    phase: plan
    spans:
      - plan
    status: conditional
    required_when:
      - bugfix_flow
      - explicit_regression_scope_needed
    role: regression verification plan and result record
    default_location: .codespec/changes/<id>/regression-test.md

  - id: test_spec
    layer: oh-extension
    file: test-spec.md
    template: templates/test-spec.md
    phase: plan
    depends_on:
      - proposal
      - spec
    conditional_depends_on:
      - artifact: design
        when: design_exists
      - artifact: spec_for_validation
        when: profile_spec_for_validation_used
    status: conditional
    required_when:
      - integration_or_system_test_design_needed
      - cross_module_or_cross_device_verification_needed
      - compatibility_or_nonfunctional_test_strategy_needs_explicit_design
    role: concrete integration, system, compatibility, and non-unit test design; consumes spec-for-validation when Profile Spec for Validation is used
    default_location: .codespec/changes/<id>/test-spec.md

  - id: spec_for_validation
    layer: oh-extension
    file: spec-for-validation.md
    template: templates/spec-for-validation.md
    template_resolution: profile_extendable
    phase: plan
    depends_on:
      - spec
      - design
    status: conditional
    bypass: true
    required_when:
      - profile_supports_spec_for_validation
      - developer_triggers_spec_for_validation
    required_sections:
      - AC 到验证点追溯
      - 来源与审批
    role: profile-extendable tester-facing projection of approved external behavior and verification points
    default_location: .codespec/changes/<id>/spec-for-validation.md
    runtime_outputs:
      - .codespec/changes/<id>/evidence/checks/check-spec-for-validation.md
    status_values:
      - Draft
      - ReadyForReview
      - Approved
      - ChangesRequested
      - Superseded

  - id: review
    layer: oh-extension
    file: review.md
    template: templates/review.md
    phase: plan
    spans:
      - plan
    status: reference
    role: GA/GB/GC status summary, review evidence index, open issues, and final decision
    default_location: .codespec/changes/<id>/review.md
    runtime_outputs:
      - .codespec/changes/<id>/evidence/reviews/spec-compliance.md
      - .codespec/changes/<id>/evidence/reviews/code-quality.md
      - .codespec/changes/<id>/evidence/reviews/verification.md

  - id: gate_checklist
    layer: oh-extension
    file: gate-checklist.md
    template: templates/gate-checklist.md
    phase: all
    status: reference
    role: reusable gate criteria template; runtime check evidence should live under evidence/checks
    runtime_outputs:
      - .codespec/changes/<id>/evidence/checks/check-proposal.md
      - .codespec/changes/<id>/evidence/checks/check-spec.md
      - .codespec/changes/<id>/evidence/checks/check-design.md
      - .codespec/changes/<id>/evidence/checks/check-execution-plan.md

  - id: epic
    layer: oh-extension
    file: epic.md
    template: templates/epic.md
    phase: specify
    spans:
      - define
      - specify
    status: conditional
    required_when:
      - complex_or_critical_change
      - cross_sig_or_cross_repository_feature
    role: cross-SIG or cross-repository feature planning
    default_location: .codespec/changes/<id>/epic.md

  - id: scenario_library
    layer: oh-extension
    file: scenario-library.md
    template: templates/scenario-library.md
    phase: specify
    status: reference
    role: reusable Gherkin scenario library for complex feature specs

  - id: claude_agent_instructions
    layer: oh-extension
    file: CLAUDE.md
    template: templates/CLAUDE.md
    phase: all
    status: reference
    role: project-level AI agent instruction template

  - id: threat_model
    layer: oh-extension
    file: threat-model.md
    template: templates/threat-model.md
    phase: design
    depends_on:
      - proposal
      - spec
      - design
    status: conditional
    required_when:
      - security_privacy_dimension_yes_and_high_risk
    role: STRIDE 威胁建模 + 法规合规,高风险安全/隐私/合规变更的深度分析
    default_location: .codespec/changes/<id>/threat-model.md

current_drifts:
  - id: phase_order_alignment
    severity: migrating
    description: ohos-sdd has migrated from the legacy Define -> Specify -> Implement -> Release wording to Define -> Specify -> Design -> Plan. Secondary historical or reference docs may still contain legacy Stage terminology until follow-up cleanup completes.
    follow_up_batch: P3 phase contract alignment
