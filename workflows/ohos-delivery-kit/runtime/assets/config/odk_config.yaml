# ODK default configuration.
#
# DO NOT edit this file — it is overwritten on every ODK version update.
#
# User overrides: odk_config_ext.yaml in this same assets/config/ directory.
# The config/ directory sits alongside templates/, contracts/ and other assets.
# ODK reads both files and merges by key: user values win, missing keys inherit
# defaults, and explicit "" remains empty. Neither file is rewritten by loading.
# Use the installed lib/odk_repository.py --effective-config to inspect the
# effective values and exact user_config_path. Edit only odk_config_ext.yaml.
# Installers must preserve this user-owned file when refreshing default assets.
#
# Example odk_config_ext.yaml:
#   design_docs_repository: https://gitcode.com/your-org/your-design-docs
#   build_products: arm64_virt rk3568 my_board
#   build_product: rk3568
#   build_command: ./build.sh --product-name {product} --ccache
#   emulator_command: ""
#   test_command: hdc shell aa test -b com.example.myapp -s unittest OpenHarmonyTestRunner

design_docs_repository: https://gitcode.com/OpenHarmonyAI/design-docs

# Build and test defaults.
#
# build_products: space-separated concrete or abstract names accepted by the
#   build command and the product directory under out/. Both use the same
#   selected name unchanged. It does not identify a hardware device; runtime
#   validation targets are confirmed separately in the plan.
#   The override replaces the entire list; keep order and remove duplicates.
#   Select one product per plan, not a build matrix. This is a scalar, not a YAML array.
#   Legacy configs without this key use build_product as the sole option.
#
# build_product: default concrete/abstract build and out/ product name in the
#   menu, never an approved selection. Keep the same selected name for compilation
#   and out/<product>; do not replace it with the validation product.
#   Ask and wait for an explicit product choice before planning, even in autonomous
#   mode. If the default is absent from the list, ask without a
#   default; never silently add it or select the first entry.
#
# build_command: compile only — no test, no push. {product} is replaced with
#   the confirmed product name. Per-Task build commands append --target <module>
#   for single-module Tasks; cross-module Tasks use this full command as-is.
#
# emulator_command: start the qemu virtual machine for arm64_virt verification.
#   Used only for validation scope emulator, independent of the build name.
#   Kernel/ramdisk paths use out/{product}, with the same product name as the
#   build command (concrete or abstract). {validation_product} is only for an
#   explicit runtime-target argument, not for changing the output directory.
#   The shipped QEMU command/layout supports arm64_virt; other emulators need
#   their actual confirmed startup command, not an inferred build-name mapping.
#
# test_command: run tests independently of build — push package and execute
#   test cases. Runs after build (and emulator when applicable) succeeds.
#   {product} and {build_product} always mean the selected build/output name.
#   {validation_product} explicitly identifies the runtime test target.
#   Arguments requiring a concrete device product must use {validation_product};
#   never pass an abstract build name as that device product.
#   Build-only skips configured runtime runners;
#   any optional host checks are recorded separately in the plan.
#   {build_product} always refers to the compile command's concrete/abstract name.
#   Leave empty ("") to have odk-plan infer the test command from each Task's
#   file scope and testing framework, or to use each Task's own 验证命令 field.
#   Override in odk_config_ext.yaml for hdc-based or board-specific test runners.
#   Common patterns:
#     hdc shell aa test -b com.example.myapp -s unittest OpenHarmonyTestRunner
#     python3 -m pytest test/ --product {validation_product}
#     ./xts/run_xts.sh --product {validation_product} --suite acts

build_products: arm64_virt rk3568
build_product: arm64_virt
build_command: ./build.sh --product-name {product} --ccache
emulator_command: qemu-system-aarch64 -machine virt -cpu cortex-a53 -m 2G -kernel out/{product}/packages/phone/images/Image -initrd out/{product}/packages/phone/images/ramdisk.img -append "console=ttyAMA0" -nographic
test_command: ""

# Review skill hooks.
#
# pre_commit_reviews: space-separated list of skill names to invoke in order
#   before source-code CR/MR/PR submission (handoff Step 1). Each skill must return
#   PASS or actionable findings. All skills must pass before the submission reminder.
#   Default: odk-review (ODK's built-in AC/code-quality review).
#
# post_commit_reviews: space-separated list of skill names to invoke in order
#   after the source CR/MR/PR is confirmed (handoff Step 2, after its URL is verified).
#   Leave empty ("") to skip post-commit review.
#   Override in odk_config_ext.yaml to add compliance, security, or API checks.
#
# Missing configured skills: before an applicable invocation ODK checks the
# current agent, looks for matching installation links in this parameter's
# preceding comment section (ext first, then defaults), installs and verifies
# the skill, then runs it. If discovery requires restart, the step stays pending.
# In odk_config_ext.yaml, prefer an explicit comment above the corresponding key:
#   # skill-install: my-security-review https://github.com/your-team/reviews/tree/main/skills/my-security-review
#   pre_commit_reviews: odk-review my-security-review
# The same convention applies to post_commit_reviews, post_cr_mr_pr_hooks,
# device_flash_skill, and the skill: modes of CI/online-test triggers.
# Community C++ review skill sources for reference (inspect their docs to find
# the exact configured skill; collection links do not install every skill):
#   googs1025/code-review-skill — structured PR/diff review with
#     Critical/Major/Minor grading and a merge recommendation.
#     https://github.com/googs1025/code-review-skill
#   kvsankar/agent-reviewer-skills — 23 granular review skills incl. C++ memory
#     safety, concurrency, and resource handling checks.
#     https://github.com/kvsankar/agent-reviewer-skills
#
# Example odk_config_ext.yaml:
#   pre_commit_reviews: odk-review my-security-review my-api-review
#   post_commit_reviews: my-compliance-check

pre_commit_reviews: odk-review
post_commit_reviews: ""

# CR/MR/PR and commit CLI tools.
#
# source_cli: command-line tool used to create/query/update the source-code CR/MR/PR.
#   The agent passes subcommands such as `pr create`, `pr list`, `pr merge`.
#   Default: oh-gc (GitCode CLI).
#   Override in odk_config_ext.yaml for GitHub (gh), GitLab (glab), or internal tools.
#
# design_docs_cli: command-line tool used to create/query/update the design-docs CR/MR/PR.
#   Default: oh-gc. Override separately when source code and design docs live on
#   different platforms. Note: changing source_cli does NOT automatically change
#   design_docs_cli — set both explicitly in odk_config_ext.yaml when needed.
#
# Common values:
#   oh-gc   — GitCode  (https://gitcode.com)
#   gh      — GitHub   (https://github.com)
#   glab    — GitLab   (https://gitlab.com)
#
# Example odk_config_ext.yaml:
#   source_cli: gh
#   design_docs_cli: gh

source_cli: oh-gc
design_docs_cli: oh-gc

# CI gate trigger.
#
# ci_trigger: how to start the CI gate after a source CR/MR/PR is created/updated.
#   The agent asks the user whether to trigger CI after its URL is confirmed,
#   then executes the configured action if the user says yes.
#
# Supported modes:
#   comment:<text>  — post a CR/MR/PR comment with the given text to trigger CI.
#                     Default: comment:start build
#   label:<name>    — add a label to the CR/MR/PR (e.g. label:ci-trigger).
#   skill:<name>    — invoke a named skill, passing its confirmed URL as context.
#   none            — do not trigger CI; leave it to the platform.
#
# Override in odk_config_ext.yaml to match your team's gate convention.
#
# Examples:
#   ci_trigger: comment:/test all
#   ci_trigger: comment:retest please
#   ci_trigger: label:ready-for-ci
#   ci_trigger: skill:my-ci-trigger
#   ci_trigger: none

ci_trigger: comment:start build

# Online test trigger.
#
# online_test_trigger: how to kick off the online test suite after the CI gate action.
#   The agent asks the user whether to trigger online tests, then executes the
#   configured action if the user says yes. When set to `none`, the prompt is
#   skipped entirely — no action is possible and the user is not asked.
#
# Supported modes:
#   comment:<text>  — post a CR/MR/PR comment with the given text to trigger online tests.
#   label:<name>    — add a label to the CR/MR/PR (e.g. label:run-online-test).
#   skill:<name>    — invoke a named skill, passing its confirmed URL as context.
#   none            — do not trigger online tests automatically (default); prompt skipped.
#
# Default: none (skip — developer triggers online tests manually).
# Override in odk_config_ext.yaml to enable.
#
# Examples:
#   online_test_trigger: comment:/run online test
#   online_test_trigger: label:run-online-test
#   online_test_trigger: skill:my-online-test-runner

online_test_trigger: none

# Physical device daily-build and so-push workflow.
# Device preparation applies only to validation scope device. The independently
# confirmed validation product, not the concrete/abstract build name, selects
# firmware support; the runtime hdc ID selects the actual device.
#
# device_flash_skill: skill to invoke when the developer wants to flash today's
#   daily build to a USB-connected rk3568 device before verification. The skill
#   handles downloading the daily image and flashing via hdc updater mode.
#   Only effective when validation_product=rk3568; ignored for other
#   products (those use qemu or have no daily-flash support).
#   Default: "" (skip — developer flashes manually). Set to the skill name to
#   enable automatic flashing, e.g.:
#     device_flash_skill: ohos-dev-distributed-device-image-flashing
#   Reference: https://gitcode.com/openharmonyinsight/openharmony-skills/tree/main/skills/ohos-dev-distributed-device-image-flashing
#
# device_so_dirs: space-separated list of local paths where compiled .so files
#   are placed after build. When empty (""), start from out/<selected product>,
#   using the SAME concrete/abstract name passed to the build command. Locate
#   the Task's actual libraries via its build log, output manifest or confirmed
#   layout (such as lib/ or lib64/), and verify architecture/variant compatibility.
#   Do not substitute the validation product as the out/ directory name. Record
#   actual source paths and target binding in Actual Result; ambiguous output
#   provenance blocks pushing until confirmed.
#   Override in odk_config_ext.yaml when the project has known explicit paths.
#
# device_service_restart: hdc shell command to restart the service under test
#   after so files are pushed. {service} is replaced with the service name
#   inferred from the Task's file scope (component name or systemd unit).
#   When empty (""), the agent infers the restart command from the component
#   that owns the changed .so files; falls back to 'hdc shell reboot' if the
#   service name cannot be determined.
#   Override in odk_config_ext.yaml only when the inferred command is wrong.
#
# Example odk_config_ext.yaml (physical board workflow):
#   device_flash_skill: ohos-dev-distributed-device-image-flashing
#   device_so_dirs: out/rk3568/lib out/rk3568/lib64
#   device_service_restart: hdc shell systemctl restart {service}

device_flash_skill: ""
device_so_dirs: ""
device_service_restart: ""

# Post-CR/MR/PR custom hooks.
#
# post_cr_mr_pr_hooks: space-separated list of skill names to invoke in order after
#   the CI gate and online-test actions are resolved (handoff Step 2), and before
#   the design-docs submission prompt. Use this to chain team-specific skills such
#   as compliance checks, security scans, notification senders, or metrics uploads.
#   Each skill receives the confirmed source CR/MR/PR URL as context.
#   Leave empty ("") to skip. Override in odk_config_ext.yaml.
#   Legacy post_pr_hooks remains readable in user overrides. When both names
#   appear in the same file, the new key wins, including an explicit empty value.
#
# Example odk_config_ext.yaml:
#   post_cr_mr_pr_hooks: my-compliance-check my-notify-slack

post_cr_mr_pr_hooks: ""

# Per-phase pre_hook and post_hook (ordered skill names, NOT shell commands).
#
# Keys are <phase>_pre_hook / <phase>_post_hook. The phase names below also
# cover bypasses, Task verification and the delivery handoff. Base and bridge
# commands share the corresponding phase keys. Multi-phase bridge commands
# apply hooks around EACH constituent phase. Missing/empty values insert no
# hook step and never appear as empty slots in next-step reminders.
#
# Order: phase_pre_hook skills -> phase action -> phase_post_hook skills.
# A failed/pending hook stops dependent work; resume the first unfinished step.
# Skipped/inapplicable phases do not run hooks. Hooks preserve existing approval
# and submission gates. post_hook runs on success, before phase completion.
# Every completion or pause names the actual next action and configured hooks,
# unless the entire applicable workflow (including its last post_hook) is done.
#
# Customize only the sibling odk_config_ext.yaml; keys override independently.
# Example:
#   # skill-install: check-spec <install-url>
#   spec_pre_hook: check-input
#   spec_post_hook: check-spec check-api
#   design_pre_hook: check-architecture-input
#   source_cr_mr_pr_pre_hook: check-branch
#   submit_design_docs_post_hook: verify-docs-pr
# Replace <install-url> with the skill's actual installation URL in the override.
# Use --phase-hooks <phase-or-odk-command> to inspect the ordered steps.
# Missing skills use the same parameter-comment installation hints as reviews.

init_pre_hook: ""
init_post_hook: ""
brainstorm_pre_hook: ""
brainstorm_post_hook: ""
