version: 3
archive_root: "codespec/changes/<repo-name>/<proposal-id>/"
minimum_contract:
  required_artifacts:
    - proposal
    - spec
    - design
    - execution-plan
  optional_artifacts:
    - metadata-tracking
    - arkts-api-spec
    - c-api-spec
    - spec-for-validation
    - threat-model
    - evidence/reviews
    - evidence/gates
  traceability_chain:
    # Declarative contract only: the validator does not auto-generate checks
    # from this list. The actual commit-to-PR association is validated by
    # metadata_tracking.yaml's pull_requests.commit field; see Level D in
    # core/rules/delivery/validation-checklist.md for the ownership split.
    - proposal
    - spec.ac
    - execution-plan.task
    - code
    - commit
    - review

# Thin resource trigger contract (security-like). Measurement/rules/evidence schemas
# are owned by subsystem gates declared as odk_resource_gate in AGENTS.md.
resource_contract:
  # Base default set only and required in every proposal table. Adding a label here
  # expands the mandatory set for all proposals (templates/skills/examples must sync).
  # Profile-dynamic extra dimensions are not implemented; unknown labels fail validation.
  dimension_labels:
    - "performance=性能"
    - "ram=内存(RAM)"
    - "storage=存储(ROM)"
  impact_states:
    - "required"
    - "review-required"
    - "not-applicable"
    - "waived"
  proposal_section: "资源开销审视"
  proposal_columns:
    - "维度"
    - "状态"
    - "信号/依据"
    - "确认人/理由/范围"
  active_when_states:
    - "required"
  evidence_root: "evidence/resource"
  conditional_sections:
    - "spec.md=资源验收契约"
    - "design.md=资源设计"
    - "execution-plan.md=资源验证矩阵"
  # AC 编号格式校验正则（fullmatch）。缺失或非法时校验器回退内置默认
  # 默认仅允许 ASCII 数字或 DFX 用户故事号，以及 ASCII 数字序号。
  ac_id_pattern: '^AC-(?:[0-9]+|DFX)\.[0-9]+$'

# Conditional, executable API specification contract. The validator activates
# this shape from proposal.md's API/SDK row instead of treating the spec heading
# alone as sufficient.
api_spec_contract:
  proposal_section: "不涉及项确认"
  trigger_dimension: "API/SDK"
  spec_section: "API 规格定义"
  overview_section: "API 概览"
  metadata_files:
    - "arkts-api-spec.yaml"
    - "c-api-spec.yaml"
  metadata_templates:
    - "templates/api/arkts-api-spec.yaml"
    - "templates/api/c-api-spec.yaml"
  metadata_schema_version: "1.0.0"
  api_contract_version: "1.0.0"
  metadata_languages:
    - "arkts"
    - "c"
  subagent_required: true
  spec_summary_only: true
  # Signatures are opaque text; syntax and types belong to the source toolchain.

# Task-level review contract. Risk is assigned while planning and may only be
# escalated at execution time; unresolved Critical/High blocks Task completion.
task_review_contract:
  guide: "contracts/skill-guides/delivery/task-review.md"
  risk_levels:
    - "R0"   # docs or non-executable configuration: no review
    - "R1"   # single-module code: one reviewer, five lenses
    - "R2"   # interface/security/cross-cutting: fixed three reviewers
  escalate_only_at_execution: true
  evidence_root: "evidence/reviews/task-<n>"
  role_reports:
    - "arch.md"
    - "scope.md"
    - "security.md"
  verdict: "verdict.md"
  verdict_frontmatter:
    - task_id
    - risk
    - independent
    - verdict
    - blocking_findings
  passing_verdict: "PASS"
  blocking_severities:
    - "Critical"
    - "High"
  advisory_severities:
    - "Medium"
    - "Low"
  serial_fallback_requires_independent_false: true

# Named conditional-section exclusions may use a standalone HTML comment:
# <!-- 不涉及：章节名；理由：具体原因 -->
# This does not waive required sections or trigger-specific validation.
artifacts:
  proposal:
    file: "proposal.md"
    template: "templates/ai/proposal.md"
    phase: "define"
    required: true
    # owns lists declared provenance/ownership, not exclusive authority:
    # fields like target_release may legitimately appear in multiple artifacts.
    owns:
      - proposal_id
      - target_release
      - change_type
      - triage
      - device_variation
      - external_dependencies
      - eight_dimension_na_confirmation
      - session_tracking
    requires: []
    required_sections:
      - "背景与问题"
      - "初始分级判断"
      - "目标"
      - "非目标"
      - "1+8 设备差异规格"
      - "Agent Scope Guard"
      - "成功标准"
      - "影响范围"
      - "外部依赖"
      - "假设与开放问题"
      - "资源开销审视"
      - "不涉及项确认"
      - "API 设计属性"
    conditional_sections:
      - section: "用户场景与业务触发"
        required_when: "The change has end-user-facing behavior or upstream business-trigger scenarios that downstream test design relies on."
      - section: "会话记录"
        required_when: "Session ID tracking is active; always present in new deliverables generated by ODK skills. Historical examples may omit this optional mirror."

  spec:
    file: "spec.md"
    template: "templates/ai/spec.md"
    phase: "specify"
    required: true
    owns:
      - acceptance_criteria
      - business_rules
      - error_codes
      - compatibility_statement
      - verification_mapping
      - session_tracking
    requires:
      - proposal
    required_sections:
      - "概述"
      - "用户故事或场景"
      - "Proposal 覆盖矩阵"
      - "业务规则"
      - "异常与边界规则"
      - "错误码定义"
      - "接口变更分析"
      - "兼容性声明"
      - "验证映射"
      - "测试设计提示"
      - "API 规格定义"
    conditional_sections:
      - section: "资源验收契约"
        trigger: resource-active
        required_when: "resource chain active (any dimension impact state in active_when_states)."
      - section: "会话记录"
        required_when: "Session ID tracking is active; always present in new deliverables generated by ODK skills. Historical examples may omit this optional mirror."

  arkts-api-spec:
    file: "arkts-api-spec.yaml"
    template: "templates/api/arkts-api-spec.yaml"
    phase: "specify"
    required: false
    owns:
      - api_metadata_contract
      - api_description
    requires:
      - proposal
      - spec
    required_sections: []
    conditional_sections: []

  c-api-spec:
    file: "c-api-spec.yaml"
    template: "templates/api/c-api-spec.yaml"
    phase: "specify"
    required: false
    owns:
      - api_metadata_contract
      - api_description
    requires:
      - proposal
      - spec
    required_sections: []
    conditional_sections: []
  design:
    file: "design.md"
    template: "templates/ai/design.md"
    phase: "design"
    required: true
    owns:
      - code_fact_baseline
      - architecture_decisions
      - module_impact
      - state_ownership
      - dfx_fault_disposition
      - verification_approach
      - session_tracking
    requires:
      - proposal
      - spec
    required_sections:
      - "需求基线摘要"
      - "设计约束"
      - "非目标"
      - "方案概述"
      - "架构图"
      - "模块影响"
      - "实现入口"
      - "关键设计决策"
      - "DFX 设计"
      - "时序设计"
      - "风险与缓解"
      - "验证思路"
    conditional_sections:
      - section: "代码事实基线"
        required_when: "The change touches existing modules, APIs, data structures, or runtime behavior."
      - section: "状态归属与不变量"
        required_when: "The change introduces or modifies complex state, ownership, lifecycle, concurrency, compatibility, performance, capacity, or migration behavior."
      - section: "既有模式复用"
        required_when: "The change should follow existing project conventions or reuse established patterns (naming, call chain, error handling, test style)."
      - section: "类图"
        required_when: "The change involves class inheritance hierarchies, interface implementation layers (e.g. IPC interface/proxy/stub/impl), or cross-module composition relationships."
      - section: "安全基础检查"
        trigger: security
        required_when: "The proposal 8-dimension eval marks 安全/权限 as 是 — the single trigger source. propose sets 安全/权限=是 when the change crosses trust boundaries (IPC/Binder/shared-mem/socket), crosses security layers (user↔kernel, sandbox, SELinux domains), handles sensitive data, or uses crypto/auth/authorization; those are the judgment basis at propose, not separate triggers (see odk-propose)."
      - section: "资源设计"
        trigger: resource-active
        required_when: "resource chain active (any dimension impact state in active_when_states)."
      - section: "国际化依赖分析"
        trigger: i18n
        required_when: "The proposal 8-dimension eval marks 国际化 as 是 — the single trigger source (see odk-propose/reference/i18n-scope-criteria.md)."
      - section: "会话记录"
        required_when: "Session ID tracking is active; always present in new deliverables generated by ODK skills. Historical examples may omit this optional mirror."

  execution-plan:
    file: "execution-plan.md"
    template: "templates/ai/execution-plan.md"
    phase: "plan"
    required: true
    owns:
      - ac_task_traceability
      - file_scope
      - task_dependencies
      - verification_commands
      - actual_results
      - verification_outcomes
      - finding_dispositions
      - code_mapping
      - session_tracking
      - task_risk_levels
      - task_review_verdicts
    requires:
      - proposal
      - spec
      - design
    # Current plans must include 构建与验证环境 per odk-plan/template; examples
    # enforce its populated fields through the shared environment validator. Keep it out of
    # global required_sections so legacy plans retain implement-time backfill;
    # when present, validate-artifacts-contract.py checks it in every mode.
    required_sections:
      - "输入状态"
      - "执行原则"
      - "AC 到 Task 追溯"
      - "实现边界"
      - "禁止项"
      - "Task 依赖"
      - "Task 列表"
      - "Task 详情"
      - "Review Gates"
      - "代码范围映射"
    conditional_sections:
      - section: "问题闭环"
        required_when: "Review, tests, validation or CI reported findings; omit when there are no findings."
      - section: "资源验证矩阵"
        trigger: resource-active
        required_when: "resource chain active (any dimension impact state in active_when_states)."
      - section: "会话记录"
        required_when: "Session ID tracking is active; always present in new deliverables generated by ODK skills. Historical examples may omit this optional mirror."
      - section: "执行模式"
        required_when: "Execution-mode selection is active; odk-implement records the confirmed mode (多子agent检查/全自动/逐步实现) at implementation start. Legacy plans may omit it until implement-time backfill."

  metadata-tracking:
    file: "metadata_tracking.yaml"
    template: "templates/metadata_tracking.yaml"
    phase: "design-docs-submit"
    required: false
    owns:
      - proposal_id
      - target_release
      - repositories
      - pull_requests
      - issues
      - session_tracking
    requires:
      - proposal
      - spec
      - design
      - execution-plan
    required_sections: []

  spec-for-validation:
    file: "spec-for-validation.md"
    template: "templates/ai/spec-for-validation.md"
    phase: "validation"
    required: false
    bypass: true
    owns:
      - integration_scenarios
      - system_scenarios
      - session_tracking
    requires:
      - proposal
      - spec
    required_sections:
      - "概述"
      - "场景"
    conditional_sections:
      - section: "会话记录"
        required_when: "Session ID tracking is active; always present in new deliverables generated by ODK skills. Historical examples may omit this optional mirror."

  threat-model:
    file: "threat-model.md"
    template: "templates/ai/threat-model.md"
    phase: "security"
    required: false
    bypass: true
    owns:
      - data_flow_diagram
      - stride_threats
      - compliance_checks
      - risk_mitigations
      - session_tracking
    requires:
      - proposal
      - spec
      - design
    required_sections:
      - "变更范围概述"
      - "数据流图"
      - "STRIDE 威胁分析"
      - "威胁汇总"
      - "法规合规检查"
      - "风险与缓解"
    conditional_sections:
      - section: "会话记录"
        required_when: "Session ID tracking is active; always present in new deliverables generated by ODK skills. Historical examples may omit this optional mirror."

  sessions-sidecar:
    file: ".sessions.json"
    phase: "all"
    required: false
    owns:
      - session_tracking
    requires: []
    required_sections: []
    description: "Sidecar file storing session IDs and log for all deliverables. Authoritative source for session tracking; frontmatter and body table are mirrors."

evidence_policy:
  minimum_archive_required: false
  recommended_root: "evidence/"
  review_templates:
    - "templates/review/review-spec-compliance.md"
    - "templates/review/review-code-quality.md"
    - "templates/review/review-verification.md"
    - "templates/review/task-arch.md"
    - "templates/review/task-scope.md"
    - "templates/review/task-security.md"
    - "templates/review/task-verdict.md"
