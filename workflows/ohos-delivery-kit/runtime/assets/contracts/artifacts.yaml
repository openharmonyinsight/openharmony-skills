version: 2
archive_root: "codespec/changes/<repo-name>/<proposal-id>/"
minimum_contract:
  required_artifacts:
    - proposal
    - spec
    - design
    - execution-plan
  optional_artifacts:
    - metadata-tracking
    - spec-for-validation
    - threat-model
    - evidence/reviews
    - evidence/gates
  traceability_chain:
    - proposal
    - spec.ac
    - execution-plan.task
    - code
    - review

# Thin resource trigger contract (security-like). Measurement/rules/evidence schemas
# are owned by subsystem gates declared as odk_resource_gate in AGENTS.md.
resource_contract:
  # Base default set only and required in every proposal table. Adding a label here
  # expands the mandatory set for all proposals (templates/skills/examples must sync).
  # Profile-dynamic extra dimensions are not implemented; unknown labels fail validation.
  dimension_labels:
    - "performance=性能"
    - "ram=内存(RAM)"
    - "storage=存储(ROM)"
  impact_states:
    - "required"
    - "review-required"
    - "not-applicable"
    - "waived"
  proposal_section: "资源开销审视"
  proposal_columns:
    - "维度"
    - "状态"
    - "信号/依据"
    - "确认人/理由/范围"
  active_when_states:
    - "required"
  evidence_root: "evidence/resource"
  conditional_sections:
    - "spec.md=资源验收契约"
    - "design.md=资源设计"
    - "execution-plan.md=资源验证矩阵"

# Conditional, executable API specification contract. The validator activates
# this shape from proposal.md's API/SDK row instead of treating the spec heading
# alone as sufficient.
api_spec_contract:
  proposal_section: "不涉及项确认"
  trigger_dimension: "API/SDK"
  spec_section: "API 规格定义"
  common_section: "公共规格属性"
  per_api_section: "逐 API 规格"
  signature_name: "language-dependent"
  common_value_rules:
    - "是否新增声明文件=boolean-decision"
    - "API 类型=api-visibility"
    - "编程语言=language"
    - "@syscap=system-capability"
    - "@since=api-version"
    - "权限=permission"
    - "跨平台/元服务/卡片=device-support"
    - "FA/Stage 模型=application-model"
  common_required_items:
    - "是否新增声明文件"
    - "API 类型"
    - "编程语言"
    - "@syscap"
    - "@since"
    - "权限"
    - "跨平台/元服务/卡片"
    - "FA/Stage 模型"
  per_api_required_spec_items:
    - "入参"
    - "返回值"
    - "错误码"
  api_description_elements:
    - "接口定义三要素=含义/功能"
    - "接口定义三要素=使用场景"
    - "接口定义三要素=使用后效果"
    - "接口使用五要素=相似接口差异"
    - "接口使用五要素=缺省配置"
    - "接口使用五要素=规格限制"
    - "接口使用五要素=生效机制"
    - "接口使用五要素=注意事项"
  supported_device_columns:
    - "设备类型"
    - "起始版本"
    - "是否支持"
  device_difference_columns:
    - "设备类型"
    - "行为表现"
    - "差异原因"
    - "差异描述"

artifacts:
  proposal:
    file: "proposal.md"
    template: "templates/ai/proposal.md"
    phase: "define"
    required: true
    owns:
      - target_release
      - change_type
      - triage
      - device_variation
      - external_dependencies
      - eight_dimension_na_confirmation
    requires: []
    required_sections:
      - "背景与问题"
      - "初始分级判断"
      - "目标"
      - "非目标"
      - "1+8 设备差异规格"
      - "Agent Scope Guard"
      - "成功标准"
      - "影响范围"
      - "外部依赖"
      - "假设与开放问题"
      - "资源开销审视"
      - "不涉及项确认"
      - "API 设计属性"
    conditional_sections:
      - section: "用户场景与业务触发"
        required_when: "The change has end-user-facing behavior or upstream business-trigger scenarios that downstream test design relies on."

  spec:
    file: "spec.md"
    template: "templates/ai/spec.md"
    phase: "specify"
    required: true
    owns:
      - acceptance_criteria
      - business_rules
      - error_codes
      - compatibility_statement
      - verification_mapping
    requires:
      - proposal
    required_sections:
      - "概述"
      - "用户故事或场景"
      - "业务规则"
      - "异常与边界规则"
      - "错误码定义"
      - "接口变更分析"
      - "兼容性声明"
      - "验证映射"
      - "测试设计提示"
      - "API 规格定义"
    conditional_sections:
      - section: "资源验收契约"
        required_when: "resource chain active (any dimension impact state in active_when_states)."

  design:
    file: "design.md"
    template: "templates/ai/design.md"
    phase: "design"
    required: true
    owns:
      - code_fact_baseline
      - architecture_decisions
      - module_impact
      - state_ownership
      - verification_approach
    requires:
      - proposal
      - spec
    required_sections:
      - "需求基线摘要"
      - "设计约束"
      - "非目标"
      - "方案概述"
      - "架构图"
      - "模块影响"
      - "实现入口"
      - "关键设计决策"
      - "DFX 设计"
      - "时序设计"
      - "风险与缓解"
      - "验证思路"
    conditional_sections:
      - section: "代码事实基线"
        required_when: "The change touches existing modules, APIs, data structures, or runtime behavior."
      - section: "状态归属与不变量"
        required_when: "The change introduces or modifies complex state, ownership, lifecycle, concurrency, compatibility, performance, capacity, or migration behavior."
      - section: "既有模式复用"
        required_when: "The change should follow existing project conventions or reuse established patterns (naming, call chain, error handling, test style)."
      - section: "类图"
        required_when: "The change involves class inheritance hierarchies, interface implementation layers (e.g. IPC interface/proxy/stub/impl), or cross-module composition relationships."
      - section: "安全基础检查"
        required_when: "The proposal 8-dimension eval marks 安全/权限 as 是 — the single trigger source. propose sets 安全/权限=是 when the change crosses trust boundaries (IPC/Binder/shared-mem/socket), crosses security layers (user↔kernel, sandbox, SELinux domains), handles sensitive data, or uses crypto/auth/authorization; those are the judgment basis at propose, not separate triggers (see odk-propose)."
      - section: "资源设计"
        required_when: "resource chain active (any dimension impact state in active_when_states)."

  execution-plan:
    file: "execution-plan.md"
    template: "templates/ai/execution-plan.md"
    phase: "plan"
    required: true
    owns:
      - ac_task_traceability
      - file_scope
      - task_dependencies
      - verification_commands
      - actual_results
      - code_mapping
    requires:
      - proposal
      - spec
      - design
    required_sections:
      - "输入状态"
      - "执行原则"
      - "AC 到 Task 追溯"
      - "实现边界"
      - "禁止项"
      - "Task 依赖"
      - "Task 列表"
      - "Task 详情"
      - "Review Gates"
      - "代码范围映射"
    conditional_sections:
      - section: "资源验证矩阵"
        required_when: "resource chain active (any dimension impact state in active_when_states)."

  metadata-tracking:
    file: "metadata_tracking.yaml"
    template: "templates/metadata_tracking.yaml"
    phase: "design-docs-submit"
    required: false
    owns:
      - proposal_id
      - target_release
      - repositories
      - pull_requests
      - issues
    requires:
      - proposal
      - spec
      - design
      - execution-plan
    required_sections: []

  spec-for-validation:
    file: "spec-for-validation.md"
    template: "templates/ai/spec-for-validation.md"
    phase: "validation"
    required: false
    bypass: true
    owns:
      - integration_scenarios
      - system_scenarios
    requires:
      - proposal
      - spec
    required_sections:
      - "概述"
      - "场景"

  threat-model:
    file: "threat-model.md"
    template: "templates/ai/threat-model.md"
    phase: "security"
    required: false
    bypass: true
    owns:
      - data_flow_diagram
      - stride_threats
      - compliance_checks
      - risk_mitigations
    requires:
      - proposal
      - spec
      - design
    required_sections:
      - "变更范围概述"
      - "数据流图"
      - "STRIDE 威胁分析"
      - "威胁汇总"
      - "法规合规检查"
      - "风险与缓解"

evidence_policy:
  minimum_archive_required: false
  recommended_root: "evidence/"
  review_templates:
    - "templates/review/review-spec-compliance.md"
    - "templates/review/review-code-quality.md"
    - "templates/review/review-verification.md"
