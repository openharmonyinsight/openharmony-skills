version: 2
kind: "odk-dfx-fmea-matcher"
description: "DFX FMEA knowledge discovery, matching, provenance, and output contract."

knowledge_source:
  relative_path: "docs/dfx/fmea.yaml"
  authority: "repository knowledge only"
  record_identity: "record_id"

discovery:
  order:
    - "workspace checkout"
    - "developer supplied local path"
    - "confirmed remote repository"
  remote_access_requires_user_confirmation: true
  network_failure_status: "UNREACHABLE"

execution:
  subagent: "default"
  subagent_handoff:
    input: "design.md path (or code scope) + involved repos + change search summary (involved_repos/modules_and_symbols/business_process_tags/associated_acs) + domain value"
    output: "hit records + AD derived entries + per-repo statuses + backfill content or written paths"
    constraint: "trigger tables and class files load only inside the subagent; the calling session receives structured results and never loads corpus content"
  fallback: "current agent sequential scan (only when no subagent facility exists; two-stage loading is mandatory then)"
  semantic_match_inputs:
    - "modules_and_symbols"
    - "business_process_tags"
  max_hits: 20

output:
  hit_fields:
    - "matched_object"
    - "fault_mode"
    - "fault_effect"
    - "fault_cause"
    - "severity"
    - "recovery"
    - "key_log"
    - "big_data_event"
    - "source_ref"
  source_ref_format: "<repo>@<commit>:docs/dfx/fmea.yaml#<record-id>"
  repo_status:
    - "READ"
    - "UNREACHABLE"
    - "NO_DFX_KNOWLEDGE"
  no_hit_closure_fields:
    - "repository"
    - "status"
    - "reason"
  library_export_table:
    section: "### 故障模式库导出表格"
    scope: "all entries (hits + derived)"
    placement: "sibling subsection under ## DFX 设计 in design.md"
    gate_note: "column set intentionally omits 5 of the 9 main-table required columns; archive main-table discovery never matches it"
  fault_disposition_table:
    section: "### DFX 故障模式处置"
    producer: "odk-design Step 6.4 (not engine output)"
    scope: "every main-table hit row (FM-nn) and every in-design AD entry (AD-nn)"
    dispositions: ["新增 AC", "复用 AC", "纳入设计约束", "现有控制覆盖", "本变更不触及"]
    gate: "validator Level C3 — structural errors fail in Draft; missing table is Draft WARN / Archive FAIL; archive requires linked ACs and 纳入设计约束 Tasks traced Pass"
    gate_note: "column set shares only 2 of the 9 main-table required columns and lives in its own subsection; main-table discovery never matches it"
  statistics:
    - "total_scanned"
    - "hit_count"

matching_rules:
  - "Interpret trigger conditions semantically; do not use string equality alone."
  - "matched_object is the changed module, class, or API that performs the triggering behavior."
  - "Do not force a match when the relationship cannot be established."
  - "Copy FMEA fields from the source record; do not invent repository knowledge."
  - "When hits exceed max_hits, return counts grouped by repository and dimension before requesting a narrower selection."

no_hit_rules:
  - "UNREACHABLE is a retrieval failure and must not be treated as a business-level no-match."
  - "NO_DFX_KNOWLEDGE means the repository was readable but the knowledge file did not exist."
  - "A no-match conclusion requires every involved repository to have a resolved status and a recorded reason."
  - "The declared involved repository set and per-repository closure rows must match exactly."
  - "The module impact repository column is the canonical involved repository set for Archive validation."
  - "Archive rejects UNREACHABLE, unknown, missing, duplicate, or unanalyzed repository states."
