# ODK default configuration.
#
# DO NOT edit this file — it is overwritten on every ODK version update.
#
# To override any value, create a odk_config_ext.yaml file in the same directory
# (installed assets directory, or core/config/ when running from source).
# odk_config_ext.yaml uses the same keys and is never touched by ODK updates.
#
# Example odk_config_ext.yaml:
#   design_docs_repository: https://gitcode.com/your-org/your-design-docs
#   build_products: arm64_virt rk3568 my_board
#   build_product: rk3568
#   build_command: ./build.sh --product-name {product} --ccache
#   emulator_command: ""
#   test_command: hdc shell aa test -b com.example.myapp -s unittest OpenHarmonyTestRunner

design_docs_repository: https://gitcode.com/OpenHarmonyAI/design-docs

# Build and test defaults.
#
# build_products: space-separated product names offered during planning.
#   The override replaces the entire list; keep order and remove duplicates.
#   Select one product per plan, not a build matrix. This is a scalar, not a YAML array.
#   Legacy configs without this key use build_product as the sole option.
#
# build_product: preferred default within build_products. The user must confirm
#   a selection before planning. If it is absent from the list, ask without a
#   default; never silently add it or select the first entry.
#
# build_command: compile only — no test, no push. {product} is replaced with
#   the confirmed product name. Per-Task build commands append --target <module>
#   for single-module Tasks; cross-module Tasks use this full command as-is.
#
# emulator_command: start the qemu virtual machine for arm64_virt verification.
#   Only used when build_product=arm64_virt. Set to empty string for physical
#   board products (rk3568 etc.) where a hardware device is used instead.
#   {product} is replaced with the confirmed product name.
#
# test_command: run tests independently of build — push package and execute
#   test cases. Runs after build (and emulator when applicable) succeeds.
#   {product} is replaced with the confirmed product name.
#   Leave empty ("") to have odk-plan infer the test command from each Task's
#   file scope and testing framework, or to use each Task's own 验证命令 field.
#   Override in odk_config_ext.yaml for hdc-based or board-specific test runners.
#   Common patterns:
#     hdc shell aa test -b com.example.myapp -s unittest OpenHarmonyTestRunner
#     python3 -m pytest test/ --product {product}
#     ./xts/run_xts.sh --product {product} --suite acts

build_products: arm64_virt rk3568
build_product: arm64_virt
build_command: ./build.sh --product-name {product} --ccache
emulator_command: qemu-system-aarch64 -machine virt -cpu cortex-a53 -m 2G -kernel out/{product}/packages/phone/images/Image -initrd out/{product}/packages/phone/images/ramdisk.img -append "console=ttyAMA0" -nographic
test_command: ""

# Review skill hooks.
#
# pre_commit_reviews: space-separated list of skill names to invoke in order
#   before source-code PR submission (handoff Step 1). Each skill must return
#   PASS or actionable findings. All skills must pass before the PR reminder.
#   Default: odk-review (ODK's built-in AC/code-quality review).
#
# post_commit_reviews: space-separated list of skill names to invoke in order
#   after the source PR is confirmed (handoff Step 2, after PR URL is verified).
#   Leave empty ("") to skip post-commit review.
#   Override in odk_config_ext.yaml to add compliance, security, or API checks.
#
# Community C++ review skills for reference (install per their docs, then list
# the skill name here):
#   googs1025/code-review-skill — structured PR/diff review with
#     Critical/Major/Minor grading and a merge recommendation.
#     https://github.com/googs1025/code-review-skill
#   kvsankar/agent-reviewer-skills — 23 granular review skills incl. C++ memory
#     safety, concurrency, and resource handling checks.
#     https://github.com/kvsankar/agent-reviewer-skills
#
# Example odk_config_ext.yaml:
#   pre_commit_reviews: odk-review my-security-review my-api-review
#   post_commit_reviews: my-compliance-check

pre_commit_reviews: odk-review
post_commit_reviews: ""

# PR and commit CLI tools.
#
# source_cli: command-line tool used to create/query/update the source-code PR.
#   The agent passes subcommands such as `pr create`, `pr list`, `pr merge`.
#   Default: oh-gc (GitCode CLI).
#   Override in odk_config_ext.yaml for GitHub (gh), GitLab (glab), or internal tools.
#
# design_docs_cli: command-line tool used to create/query/update the design-docs PR.
#   Default: oh-gc. Override separately when source code and design docs live on
#   different platforms. Note: changing source_cli does NOT automatically change
#   design_docs_cli — set both explicitly in odk_config_ext.yaml when needed.
#
# Common values:
#   oh-gc   — GitCode  (https://gitcode.com)
#   gh      — GitHub   (https://github.com)
#   glab    — GitLab   (https://gitlab.com)
#
# Example odk_config_ext.yaml:
#   source_cli: gh
#   design_docs_cli: gh

source_cli: oh-gc
design_docs_cli: oh-gc

# CI gate trigger.
#
# ci_trigger: how to start the CI gate after a source PR is created/updated.
#   The agent asks the user whether to trigger CI after the PR URL is confirmed,
#   then executes the configured action if the user says yes.
#
# Supported modes:
#   comment:<text>  — post a PR comment with the given text to trigger CI.
#                     Default: comment:start build
#   label:<name>    — add a label to the PR (e.g. label:ci-trigger).
#   skill:<name>    — invoke a named skill, passing the confirmed PR URL as context.
#   none            — do not trigger CI; leave it to the platform.
#
# Override in odk_config_ext.yaml to match your team's gate convention.
#
# Examples:
#   ci_trigger: comment:/test all
#   ci_trigger: comment:retest please
#   ci_trigger: label:ready-for-ci
#   ci_trigger: skill:my-ci-trigger
#   ci_trigger: none

ci_trigger: comment:start build

# Online test trigger.
#
# online_test_trigger: how to kick off the online test suite after the CI gate action.
#   The agent asks the user whether to trigger online tests, then executes the
#   configured action if the user says yes. When set to `none`, the prompt is
#   skipped entirely — no action is possible and the user is not asked.
#
# Supported modes:
#   comment:<text>  — post a PR comment with the given text to trigger online tests.
#   label:<name>    — add a label to the PR (e.g. label:run-online-test).
#   skill:<name>    — invoke a named skill, passing the confirmed PR URL as context.
#   none            — do not trigger online tests automatically (default); prompt skipped.
#
# Default: none (skip — developer triggers online tests manually).
# Override in odk_config_ext.yaml to enable.
#
# Examples:
#   online_test_trigger: comment:/run online test
#   online_test_trigger: label:run-online-test
#   online_test_trigger: skill:my-online-test-runner

online_test_trigger: none

# Physical device daily-build and so-push workflow.
# Only applies when build_product is a physical board (not arm64_virt).
#
# device_flash_skill: skill to invoke when the developer wants to flash today's
#   daily build to a USB-connected rk3568 device before verification. The skill
#   handles downloading the daily image and flashing via hdc updater mode.
#   Only effective when build_product=rk3568; ignored for arm64_virt and other
#   products (those use qemu or have no daily-flash support).
#   Default: "" (skip — developer flashes manually). Set to the skill name to
#   enable automatic flashing, e.g.:
#     device_flash_skill: ohos-dev-distributed-device-image-flashing
#   Reference: https://gitcode.com/openharmonyinsight/openharmony-skills/tree/main/skills/ohos-dev-distributed-device-image-flashing
#
# device_so_dirs: space-separated list of local paths where compiled .so files
#   are placed after build. When empty (""), the agent infers the output paths
#   from the build_product and the Task's changed source files (e.g.
#   out/{product}/lib/, out/{product}/lib64/).
#   Override in odk_config_ext.yaml only when the inferred path is wrong.
#
# device_service_restart: hdc shell command to restart the service under test
#   after so files are pushed. {service} is replaced with the service name
#   inferred from the Task's file scope (component name or systemd unit).
#   When empty (""), the agent infers the restart command from the component
#   that owns the changed .so files; falls back to 'hdc shell reboot' if the
#   service name cannot be determined.
#   Override in odk_config_ext.yaml only when the inferred command is wrong.
#
# Example odk_config_ext.yaml (physical board workflow):
#   device_flash_skill: ohos-dev-distributed-device-image-flashing
#   device_so_dirs: out/rk3568/lib out/rk3568/lib64
#   device_service_restart: hdc shell systemctl restart {service}

device_flash_skill: ""
device_so_dirs: ""
device_service_restart: ""

# Post-PR custom hooks.
#
# post_pr_hooks: space-separated list of skill names to invoke in order after
#   the CI gate and online-test actions are resolved (handoff Step 2), and before
#   the design-docs submission prompt. Use this to chain team-specific skills such
#   as compliance checks, security scans, notification senders, or metrics uploads.
#   Each skill receives the confirmed source PR URL as context.
#   Leave empty ("") to skip. Override in odk_config_ext.yaml.
#
# Example odk_config_ext.yaml:
#   post_pr_hooks: my-compliance-check my-notify-slack

post_pr_hooks: ""
