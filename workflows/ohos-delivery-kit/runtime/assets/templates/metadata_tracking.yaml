# Prepared locally after a confirmed source PR; refreshed before design-docs submission.
proposal_id: "{{PROPOSAL_ID}}"
target_release: "{{TARGET_RELEASE}}"
repos:
  - repo: "{{ORGANIZATION}}/{{REPOSITORY}}"
    # Use the actual target repository's credential-free HTTPS web URL.
    # Keep the platform-returned PR URL; never invent a merge_requests alias.
    repository_url: "{{REPOSITORY_URL}}"
    # An empty list is valid before the business-code PR has been created.
    pull_requests: []
    # Populated form:
    # pull_requests:
    #   - url: "https://gitcode.com/{{ORGANIZATION}}/{{REPOSITORY}}/pull/123"
    #     title: "Implement the requirement"
    #     state: "open" # open | merged | closed
    #     commit: "0123456789abcdef0123456789abcdef01234567"
    # Optional extension (GitCode only); omit by default.
    # issues:
    #   - issue: 12345
    #     url: "https://gitcode.com/{{ORGANIZATION}}/{{REPOSITORY}}/issues/12345"
    #     title: "Track the requirement"
    #     type: "requirement" # requirement | bug | task | epic
    #     state: "open" # open | closed
    #     closed_at: "2026-09-04" # omit while open or when unknown
