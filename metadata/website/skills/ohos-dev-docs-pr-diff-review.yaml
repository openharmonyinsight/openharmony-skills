schemaVersion: 1
id: ohos-dev-docs-pr-diff-review
title: 文档 PR 改动检视
summary: 针对 OpenHarmony 文档 PR 的新增、修改和关键删除内容进行检视，提供精确定位、规则依据及未覆盖范围说明。
category:
  scope: common
  namespace: development
  stage: development
  domain: docs
  capability: pr-diff-review
status:
  maturity: draft
  version: 0.1.0
  owner: openharmony
tags:
- docs
- quality-review
audience:
- OpenHarmony 文档作者
- 文档评审人员
useCases:
- title: 文档 PR 改动检视
  description: 针对 OpenHarmony 文档 PR 的新增、修改和关键删除内容进行检视，提供精确定位、规则依据及未覆盖范围说明。
whenToUse:
- 在用户要求仅评审 OpenHarmony/HarmonyOS 文档 PR 的改动点、diff 或补丁时使用。接收 GitCode/GitHub PR、本地提交范围或 unified diff，排除未改动行的既有问题。
whenNotToUse:
- 需要实际编译部署或设备运行，而非文档检视
- 与文档质量无关的完整业务代码审查
inputs:
  required:
  - 待检视文档或补丁
  optional:
  - 项目规范
  - API/SDK版本及匹配声明
  - 目标分支、Issue 或PR信息
outputs:
- 问题清单、精确定位与修改建议
- 检查覆盖情况和验证限制
quickStart:
  steps:
  - 准备待检视文档或补丁。
  - 说明检视范围、项目规范及可用的 SDK 信息。
  - 使用该技能检视，并核对问题证据和未验证项。
  examplePrompt: 请使用 ohos-dev-docs-pr-diff-review 检视这份文档 PR 补丁，只报告本次改动引入的问题。
related:
  skills:
  - ohos-dev-docs-writing-compliance-review
  - ohos-dev-docs-api-reference-review
  - ohos-dev-docs-dev-guide-review
  - ohos-dev-docs-code-correctness-review
  docs:
  - title: 维护者说明
    path: README.md
  - title: 评估用例与方法
    path: evals/README.md
